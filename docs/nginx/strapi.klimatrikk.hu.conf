# Install this as /etc/nginx/sites-available/strapi.klimatrikk.hu and enable it.
# Obtain the certificate before enabling this HTTPS server block:
# certbot certonly --webroot -w /var/www/certbot -d strapi.klimatrikk.hu

server {
    listen 80;
    listen [::]:80;
    server_name strapi.klimatrikk.hu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name strapi.klimatrikk.hu;

    ssl_certificate /etc/letsencrypt/live/strapi.klimatrikk.hu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/strapi.klimatrikk.hu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}